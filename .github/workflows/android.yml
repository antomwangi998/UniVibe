name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle 8.9 on PATH, so no gradle-wrapper.jar is needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build fast APK (not debuggable; use this one to judge smoothness)
        run: gradle assembleFast --stacktrace

      - name: Upload fast APK
        uses: actions/upload-artifact@v4
        with:
          name: univibe-fast-apk
          path: app/build/outputs/apk/fast/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: univibe-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
