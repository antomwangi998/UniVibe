org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend (Render). Public URL, not a secret. Blank it to use the on-device mock in debug builds.
univibe.apiBaseUrl=https://univibe-jp3j.onrender.com

# Sign in with Google: the OAuth *web application* client id (see docs/GOOGLE_SIGN_IN.md). Public, not a secret.
# Blank hides the "Continue with Google" button. It must equal GOOGLE_WEB_CLIENT_ID on the server.
univibe.googleServerClientId=
