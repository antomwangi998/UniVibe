# Render Blueprint: create a Web Service from this repo. The database lives on Neon (DATABASE_URL).
services:
  - type: web
    name: univibe-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CODE_PEPPER
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Photo and video storage (Cloudflare R2). All four are needed; without them every upload answers 503
      # and the app says "Photo and video uploads aren't available right now".
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Push notifications. Optional: without it push is skipped and in-app notifications still work.
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      # Public https address of this service (no trailing slash). Optional: without it event share links are app-only.
      - key: PUBLIC_BASE_URL
        sync: false
      # Sign in with Google (OAuth web client id, not a secret). Optional: without it the Google button answers 503.
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
